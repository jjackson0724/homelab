title: System Information Discovery via Native Windows Commands
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: Detects system enumeration via systeminfo, wmic os, or Get-ComputerInfo associated with T1082.
references:
  - https://attack.mitre.org/techniques/T1082/
author: Jarron Jackson - Matrix Homelab
date: 2026-08-08
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection_systeminfo:
    Image|endswith: '\systeminfo.exe'
  selection_wmic:
    CommandLine|contains:
      - 'wmic os get'
      - 'wmic computersystem get'
      - 'wmic bios get'
  selection_powershell:
    CommandLine|contains:
      - 'Get-ComputerInfo'
      - 'Get-WmiObject Win32_OperatingSystem'
      - 'Get-CimInstance Win32_OperatingSystem'
  condition: 1 of selection_*
falsepositives:
  - IT asset inventory tools
  - Configuration management agents
level: low
notes: |
  Log Sources: EventID 4688, Sysmon EID 1, PowerShell EID 4104
  KQL: process.name: systeminfo.exe OR process.command_line: *wmic os get*
  SPL: index=windows (Image=*systeminfo.exe OR CommandLine=*wmic os get*)
  Observed Phase 1 on Sentinel. Detection gap - Seraph pending Neb deployment.
