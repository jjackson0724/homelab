title: Local Account Discovery via Net or Wmic
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects enumeration of local accounts using net.exe, wmic, or PowerShell associated with T1087.001.
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: Jarron Jackson - Matrix Homelab
date: 2026-08-08
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    CommandLine|contains:
      - 'net user'
      - 'net localgroup'
      - 'net accounts'
  selection_wmic:
    CommandLine|contains:
      - 'wmic useraccount'
      - 'wmic group'
  selection_powershell:
    CommandLine|contains:
      - 'Get-LocalUser'
      - 'Get-LocalGroup'
      - 'Get-LocalGroupMember'
  condition: 1 of selection_*
falsepositives:
  - Legitimate administrative activity
  - IT helpdesk scripts
level: medium
notes: |
  Log Sources: EventID 4688, Sysmon EID 1, PowerShell EID 4104
  Observed Phase 1 on Sentinel. Detection gap - Seraph pending Neb deployment.
